<div class="container">
  @for (
    weather of weatherList();
    track weather.id;
    let count = $count;
    let first = $first;
    ) {
    @if (first) {
      <h3> {{count | number: '1.0-0'}} Weather item Showing</h3>
      <button (click)="addWeather()">Add Severe Weather Item</button>
    }
    <app-weather-list-item
      [weatherList]="weather"
      (opened)="onWeatherOpened($event)"
      (removeWeather)="removeWeather($event)">
    </app-weather-list-item>
  }
</div>
